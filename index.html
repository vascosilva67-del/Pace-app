<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>PACE.</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; background: #101214; }
  .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
  input, select { font-family: 'Inter', sans-serif; }
  input:focus, select:focus { outline: none; border-color: #FF4B2B !important; }
  ::placeholder { color: #5A5F64; }
  .scrollx::-webkit-scrollbar { height: 6px; }
  .scrollx::-webkit-scrollbar-thumb { background: #2A2E33; border-radius: 3px; }
  .chip { font-size: 11px; color: #8B9096; background: #101214; border: 1px solid #2A2E33; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

// ==HELPERS START==
const RUN_DISTANCES = [
  { key: "1k", label: "1K", km: 1 },
  { key: "5k", label: "5K", km: 5 },
  { key: "10k", label: "10K", km: 10 },
  { key: "15k", label: "15K", km: 15 },
  { key: "20k", label: "20K", km: 20 },
  { key: "half", label: "Half", km: 21.0975 },
  { key: "30k", label: "30K", km: 30 },
  { key: "35k", label: "35K", km: 35 },
  { key: "40k", label: "40K", km: 40 },
  { key: "marathon", label: "Marathon", km: 42.195 },
];
const SWIM_DISTANCES = [
  { key: "100m", label: "100m", km: 0.1 },
  { key: "200m", label: "200m", km: 0.2 },
  { key: "400m", label: "400m", km: 0.4 },
  { key: "750m", label: "750m", km: 0.75 },
  { key: "1000m", label: "1000m", km: 1 },
  { key: "1500m", label: "1500m", km: 1.5 },
  { key: "1900m", label: "1900m", km: 1.9 },
  { key: "3800m", label: "3800m", km: 3.8 },
];
const BIKE_DISTANCES = [
  { key: "10k", label: "10K", km: 10 },
  { key: "20k", label: "20K", km: 20 },
  { key: "40k", label: "40K", km: 40 },
  { key: "90k", label: "90K", km: 90 },
  { key: "100k", label: "100K", km: 100 },
  { key: "180k", label: "180K", km: 180 },
];
const TRI_FORMATS = [
  { key: "sprint", label: "Sprint", swimKm: 0.75, bikeKm: 20, runKm: 5 },
  { key: "olympic", label: "Olímpico", swimKm: 1.5, bikeKm: 40, runKm: 10 },
  { key: "half", label: "70.3 / Meio", swimKm: 1.9, bikeKm: 90, runKm: 21.0975 },
  { key: "full", label: "Full / Ironman", swimKm: 3.8, bikeKm: 180, runKm: 42.195 },
  { key: "other", label: "Outro", swimKm: 0, bikeKm: 0, runKm: 0 },
];
const SPORTS = {
  run: { label: "Corrida", color: "#FF4B2B", icon: "🏃", distances: RUN_DISTANCES, surfaces: ["Road", "Trail", "Track"] },
  swim: { label: "Natação", color: "#4BB4FF", icon: "🏊", distances: SWIM_DISTANCES, surfaces: ["Pool", "Open water"] },
  bike: { label: "Ciclismo", color: "#B58CFF", icon: "🚴", distances: BIKE_DISTANCES, surfaces: ["Road", "Gravel", "MTB", "Indoor"] },
  tri: { label: "Triatlo", color: "#F2F1ED", icon: "🏅", distances: [], surfaces: [] },
};
const SURFACE_LABELS = { Road: "Estrada", Trail: "Trail", Track: "Pista", Pool: "Piscina", "Open water": "Águas abertas", Gravel: "Gravel", MTB: "BTT", Indoor: "Indoor" };
const DEFAULT_PRESET = { run: "5k", swim: "400m", bike: "40k" };
const PLAN_SPORTS = {
  swim: { label: "Natação", color: "#4BB4FF" },
  bike: { label: "Ciclismo", color: "#B58CFF" },
  run: { label: "Corrida", color: "#FF4B2B" },
  brick: { label: "Brick", color: "#FFC24B" },
  strength: { label: "Força", color: "#8B9096" },
};
const DAY_NAMES = ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"];
const MONTH_NAMES = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
const WEATHER_OPTIONS = ["None", "Ideal", "Hot", "Cold", "Rain", "Windy", "Humid"];

function triFormat(key) { return TRI_FORMATS.find((f) => f.key === key) || TRI_FORMATS[TRI_FORMATS.length - 1]; }
function triTotalKm(key) { const f = triFormat(key); return f.swimKm + f.bikeKm + f.runKm; }

function nearestStandard(km, sport = "run") {
  const list = (SPORTS[sport] || SPORTS.run).distances;
  let best = null, bestDiff = Infinity;
  for (const s of list) {
    const diff = Math.abs(s.km - km) / s.km;
    if (diff < 0.03 && diff < bestDiff) { best = s; bestDiff = diff; }
  }
  return best;
}
function num(v) {
  if (v === "" || v == null) return null;
  const n = parseFloat(String(v).replace(",", "."));
  return isFinite(n) ? n : null;
}
function parseTime(str) {
  if (str == null) return null;
  const parts = String(str).split(":").map((p) => p.trim()).filter((p) => p !== "");
  if (parts.length === 0 || parts.some((p) => isNaN(Number(p)))) return null;
  let secs = 0;
  if (parts.length === 3) secs = (+parts[0]) * 3600 + (+parts[1]) * 60 + (+parts[2]);
  else if (parts.length === 2) secs = (+parts[0]) * 60 + (+parts[1]);
  else if (parts.length === 1) secs = +parts[0];
  else return null;
  return secs > 0 ? secs : null;
}
function formatTime(secs) {
  if (secs == null || !isFinite(secs)) return "--";
  secs = Math.round(secs);
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  return `${m}:${String(s).padStart(2, "0")}`;
}
function formatRate(sport, km, seconds) {
  if (!km || !seconds || !isFinite(km) || !isFinite(seconds) || sport === "tri") return "--";
  if (sport === "bike") return `${(km / (seconds / 3600)).toFixed(1)} km/h`;
  const per = sport === "swim" ? seconds / (km * 10) : seconds / km;
  const m = Math.floor(per / 60);
  const s = Math.round(per % 60);
  const mm = s === 60 ? m + 1 : m;
  const ss = s === 60 ? 0 : s;
  return `${mm}:${String(ss).padStart(2, "0")}${sport === "swim" ? "/100m" : "/km"}`;
}
function formatDistance(sport, km) {
  if (sport === "swim") return `${Math.round(km * 1000)} m`;
  return `${+(+km).toFixed(2)} km`;
}
function safeIsoDate(v) {
  const d = new Date(v);
  if (isNaN(d.getTime())) return localISO(new Date());
  return localISO(d);
}
function localISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${dd}`;
}
function parseLocalDate(iso) {
  const [y, m, d] = String(iso).split("-").map(Number);
  return new Date(y, m - 1, d);
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function startOfWeek(d) {
  const x = new Date(d);
  const day = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - day);
  x.setHours(0, 0, 0, 0);
  return x;
}
function formatMinutes(min) {
  if (!min) return "0min";
  const h = Math.floor(min / 60);
  const m = Math.round(min % 60);
  if (h === 0) return `${m}min`;
  return `${h}h${String(m).padStart(2, "0")}`;
}
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = ((lat2 - lat1) * Math.PI) / 180;
  const dLon = ((lon2 - lon1) * Math.PI) / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
const uid = () => Math.random().toString(36).slice(2, 10);

function prKeyForRace(r) {
  const sport = r.sport || "run";
  if (sport === "tri") {
    const f = triFormat(r.tri && r.tri.format);
    return { key: "tri:" + f.key, label: f.label, km: r.km };
  }
  const std = nearestStandard(r.km, sport);
  if (std) return { key: sport + ":" + std.key, label: std.label, km: std.km };
  const label = sport === "swim" ? `${Math.round(r.km * 1000)}m` : `${r.km} km`;
  return { key: sport + ":other:" + (+r.km).toFixed(2), label, km: r.km };
}
function computePRs(races, manualPRs) {
  const map = {};
  for (const r of races) {
    if (r.excludeFromPR) continue;
    const sport = r.sport || "run";
    if (sport === "tri" && (!r.tri || r.tri.format === "other")) continue;
    const k = prKeyForRace(r);
    if (!map[k.key] || r.seconds < map[k.key].seconds) {
      map[k.key] = { ...r, sport, key: k.key, label: k.label, km: k.km, source: "race" };
    }
  }
  for (const sport of ["run", "swim", "bike"]) {
    for (const std of SPORTS[sport].distances) {
      const key = sport + ":" + std.key;
      const m = manualPRs[key];
      if (m && m.seconds && (!map[key] || m.seconds < map[key].seconds)) {
        map[key] = { id: "manual-" + key, sport, key, name: m.note || "PR manual", date: m.date || null, km: std.km, seconds: m.seconds, label: std.label, source: "manual" };
      }
    }
  }
  return map;
}
function prForGoal(g, prs) {
  const sport = g.sport || "run";
  if (sport === "tri") {
    const f = triFormat(g.triFormat);
    return { label: f.label, pr: prs["tri:" + f.key] || null };
  }
  const std = nearestStandard(g.km, sport);
  return { label: std ? std.label : null, pr: std ? prs[sport + ":" + std.key] || null : null };
}
function migrateRaces(list) { return (Array.isArray(list) ? list : []).map((r) => ({ ...r, sport: r.sport || "run" })); }
function migrateGoals(list) { return (Array.isArray(list) ? list : []).map((g) => ({ ...g, sport: g.sport || "run" })); }
function migrateManualPRs(obj) {
  const out = {};
  for (const [k, v] of Object.entries(obj || {})) out[k.includes(":") ? k : "run:" + k] = v;
  return out;
}
function sportFromType(t) {
  const s = String(t || "").toLowerCase();
  if (s.includes("swim")) return "swim";
  if (s.includes("ride") || s.includes("cycl") || s.includes("bike")) return "bike";
  if (s.includes("run")) return "run";
  return null;
}
// ==HELPERS END==

function findHeader(headers, includesArr) {
  return headers.find((h) => includesArr.some((inc) => h.toLowerCase().includes(inc)));
}
function parseCsvText(text) {
  const result = Papa.parse(text, { header: true, skipEmptyLines: true });
  const headers = result.meta.fields || [];
  const dateKey = findHeader(headers, ["activity date", "date"]);
  const nameKey = findHeader(headers, ["activity name", "name"]);
  const typeKey = findHeader(headers, ["activity type", "type"]);
  const distKey = findHeader(headers, ["distance"]);
  const timeKey = findHeader(headers, ["elapsed time", "moving time", "time"]);
  const elevKey = findHeader(headers, ["elevation gain", "elevation"]);
  return result.data.map((row) => {
    const type = typeKey ? String(row[typeKey] || "") : "";
    const sport = type ? sportFromType(type) : "run";
    const rawDist = distKey ? parseFloat(row[distKey]) : NaN;
    let km = null;
    if (isFinite(rawDist)) {
      if (sport === "swim") km = rawDist > 50 ? rawDist / 1000 : rawDist;
      else km = rawDist > 1000 ? rawDist / 1000 : rawDist;
    }
    const rawTime = timeKey ? parseFloat(row[timeKey]) : NaN;
    const seconds = isFinite(rawTime) ? rawTime : null;
    return {
      id: uid(), include: sport != null, sport: sport || "run",
      name: nameKey ? row[nameKey] || "Imported" : "Imported",
      date: dateKey ? safeIsoDate(row[dateKey]) : safeIsoDate(Date.now()),
      km, seconds, elevationM: elevKey && sport !== "swim" ? parseFloat(row[elevKey]) || null : null, type,
    };
  }).filter((r) => r.km || r.seconds);
}
function parseGpxText(text, filename) {
  const xml = new DOMParser().parseFromString(text, "application/xml");
  if (xml.querySelector("parsererror")) return [];
  const pts = Array.from(xml.getElementsByTagName("trkpt"));
  if (pts.length === 0) return [];
  let distKm = 0, elevGain = 0, prevLat = null, prevLon = null, prevEle = null;
  const times = [];
  for (const pt of pts) {
    const lat = parseFloat(pt.getAttribute("lat"));
    const lon = parseFloat(pt.getAttribute("lon"));
    const eleNode = pt.getElementsByTagName("ele")[0];
    const timeNode = pt.getElementsByTagName("time")[0];
    const ele = eleNode ? parseFloat(eleNode.textContent) : null;
    if (timeNode) times.push(timeNode.textContent);
    if (prevLat != null) {
      distKm += haversineKm(prevLat, prevLon, lat, lon);
      if (ele != null && prevEle != null && ele > prevEle) elevGain += ele - prevEle;
    }
    prevLat = lat; prevLon = lon; prevEle = ele;
  }
  const seconds = times.length >= 2 ? (new Date(times[times.length - 1]) - new Date(times[0])) / 1000 : null;
  const nameNode = xml.getElementsByTagName("name")[0];
  const typeNode = xml.getElementsByTagName("type")[0];
  const sport = sportFromType(typeNode ? typeNode.textContent : "") || "run";
  const name = nameNode ? nameNode.textContent : filename.replace(/\.gpx$/i, "");
  return [{ id: uid(), include: true, sport, name, date: times.length ? safeIsoDate(times[0]) : safeIsoDate(Date.now()),
    km: Math.round(distKm * 100) / 100, seconds: seconds ? Math.round(seconds) : null, elevationM: Math.round(elevGain), type: "" }];
}

function loadLS(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
}

function App() {
  const [tab, setTab] = useState("races");
  const [sportFilter, setSportFilter] = useState("all");
  const [prSport, setPrSport] = useState("run");
  const [races, setRaces] = useState(() => migrateRaces(loadLS("pace_races", [])));
  const [goals, setGoals] = useState(() => migrateGoals(loadLS("pace_goals", [])));
  const [manualPRs, setManualPRs] = useState(() => migrateManualPRs(loadLS("pace_manualPRs", {})));
  const [plan, setPlan] = useState(() => loadLS("pace_plan", []));
  const [weekStart, setWeekStart] = useState(() => startOfWeek(new Date()));
  const [showRaceForm, setShowRaceForm] = useState(false);
  const [showGoalForm, setShowGoalForm] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [showManualPR, setShowManualPR] = useState(false);
  const [sessionDate, setSessionDate] = useState(null);

  useEffect(() => { localStorage.setItem("pace_races", JSON.stringify(races)); }, [races]);
  useEffect(() => { localStorage.setItem("pace_goals", JSON.stringify(goals)); }, [goals]);
  useEffect(() => { localStorage.setItem("pace_manualPRs", JSON.stringify(manualPRs)); }, [manualPRs]);
  useEffect(() => { localStorage.setItem("pace_plan", JSON.stringify(plan)); }, [plan]);

  const prs = useMemo(() => computePRs(races, manualPRs), [races, manualPRs]);
  const prList = useMemo(() => Object.values(prs).sort((a, b) => a.km - b.km), [prs]);

  const byDate = (a, b) => new Date(b.date) - new Date(a.date);
  function addRace(r) { setRaces((p) => [...p, r].sort(byDate)); setShowRaceForm(false); }
  function addRaces(list) { setRaces((p) => [...p, ...list].sort(byDate)); setShowImport(false); }
  function deleteRace(id) { setRaces((p) => p.filter((r) => r.id !== id)); }
  function addGoal(g) { setGoals((p) => [...p, g]); setShowGoalForm(false); }
  function deleteGoal(id) { setGoals((p) => p.filter((g) => g.id !== id)); }
  function setManualPR(key, data) {
    setManualPRs((prev) => {
      if (data) return { ...prev, [key]: data };
      const n = { ...prev }; delete n[key]; return n;
    });
  }
  function addSession(s) { setPlan((p) => [...p, s]); setSessionDate(null); }
  function toggleSession(id) { setPlan((p) => p.map((s) => (s.id === id ? { ...s, done: !s.done } : s))); }
  function deleteSession(id) { setPlan((p) => p.filter((s) => s.id !== id)); }
  function copyPrevWeek() {
    const prevStart = addDays(weekStart, -7);
    const prevDates = new Set(Array.from({ length: 7 }, (_, i) => localISO(addDays(prevStart, i))));
    const copies = plan.filter((s) => prevDates.has(s.date)).map((s) => ({ ...s, id: uid(), date: localISO(addDays(parseLocalDate(s.date), 7)), done: false }));
    setPlan((p) => [...p, ...copies]);
  }

  function exportBackup() {
    const payload = JSON.stringify({ races, goals, manualPRs, plan, exportedAt: new Date().toISOString() }, null, 2);
    const blob = new Blob([payload], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `pace-backup-${localISO(new Date())}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  }
  function restoreBackup(file) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (Array.isArray(data.races)) setRaces(migrateRaces(data.races));
        if (Array.isArray(data.goals)) setGoals(migrateGoals(data.goals));
        if (data.manualPRs && typeof data.manualPRs === "object") setManualPRs(migrateManualPRs(data.manualPRs));
        if (Array.isArray(data.plan)) setPlan(data.plan);
      } catch (e) { alert("Não consegui ler este ficheiro."); }
    };
    reader.readAsText(file);
  }

  const tabs = [{ key: "races", label: "Provas" }, { key: "prs", label: "PRs" }, { key: "goals", label: "Objetivos" }, { key: "week", label: "Semana" }];

  return (
    <div style={{ minHeight: "100vh", background: "#101214", color: "#F2F1ED", fontFamily: "'Inter', sans-serif" }}>
      <div style={{ maxWidth: 720, margin: "0 auto", padding: "28px 20px 80px" }}>
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 6 }}>
          <h1 className="display" style={{ fontSize: 40, margin: 0, lineHeight: 1 }}>PACE<span style={{ color: "#FF4B2B" }}>.</span></h1>
          <span className="mono" style={{ fontSize: 12, color: "#5A5F64" }}>{races.length} prova{races.length !== 1 ? "s" : ""}</span>
        </div>
        <p style={{ color: "#8B9096", fontSize: 14, marginTop: 0, marginBottom: 24 }}>Guardado neste telemóvel.</p>

        <div style={{ display: "flex", gap: 4, background: "#1A1D21", padding: 4, borderRadius: 10, marginBottom: 24 }}>
          {tabs.map((t) => (
            <button key={t.key} onClick={() => setTab(t.key)} style={{ flex: 1, padding: "9px 0", borderRadius: 7, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 600, background: tab === t.key ? "#FF4B2B" : "transparent", color: tab === t.key ? "#101214" : "#8B9096" }}>{t.label}</button>
          ))}
        </div>

        {tab === "races" && <RacesTab races={races} filter={sportFilter} setFilter={setSportFilter} prs={prs} prList={prList} onAdd={() => setShowRaceForm(true)} onImport={() => setShowImport(true)} onDelete={deleteRace} />}
        {tab === "prs" && <PrsTab sport={prSport} setSport={setPrSport} prList={prList} races={races} onEditManual={() => setShowManualPR(true)} />}
        {tab === "goals" && <GoalsTab goals={goals} prs={prs} onAdd={() => setShowGoalForm(true)} onDelete={deleteGoal} />}
        {tab === "week" && <WeekTab plan={plan} weekStart={weekStart} setWeekStart={setWeekStart} onAdd={(d) => setSessionDate(d)} onToggle={toggleSession} onDelete={deleteSession} onCopyPrev={copyPrevWeek} />}

        <BackupBar onExport={exportBackup} onRestore={restoreBackup} />
      </div>

      {showRaceForm && <RaceForm initialSport={sportFilter} onSave={addRace} onClose={() => setShowRaceForm(false)} />}
      {showGoalForm && <GoalForm onSave={addGoal} onClose={() => setShowGoalForm(false)} />}
      {showImport && <ImportModal onSave={addRaces} onClose={() => setShowImport(false)} />}
      {showManualPR && prSport !== "tri" && <ManualPRModal sport={prSport} manualPRs={manualPRs} races={races} onSave={setManualPR} onClose={() => setShowManualPR(false)} />}
      {sessionDate && <SessionForm date={sessionDate} onSave={addSession} onClose={() => setSessionDate(null)} />}
    </div>
  );
}

function BackupBar({ onExport, onRestore }) {
  const inputRef = useRef(null);
  return (
    <div style={{ display: "flex", justifyContent: "center", gap: 18, marginTop: 36, paddingTop: 18, borderTop: "1px solid #1E2124" }}>
      <input ref={inputRef} type="file" accept=".json" style={{ display: "none" }} onChange={(e) => { if (e.target.files[0]) onRestore(e.target.files[0]); e.target.value = ""; }} />
      <button onClick={onExport} style={{ background: "none", border: "none", color: "#5A5F64", fontSize: 12, cursor: "pointer", textDecoration: "underline" }}>Exportar backup</button>

    </div>
  );
}

function SportChips({ value, onChange, keys, withAll, mb }) {

function weatherChipText(w) {
  if (!w || !w.condition || w.condition === "None") return null;
  return w.tempC != null && w.tempC !== "" ? `${w.condition} · ${w.tempC}°C` : w.condition;
}

function WeekTab({ plan, weekStart, setWeekStart, onAdd, onToggle, onDelete, onCopyPrev }) {
  const days = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  const isoDays = days.map(localISO);
  const todayISO = localISO(new Date());
  const weekSessions = plan.filter((s) => isoDays.includes(s.date));
  const prevISO = Array.from({ length: 7 }, (_, i) => localISO(addDays(weekStart, i - 7)));
  const prevCount = plan.filter((s) => prevISO.includes(s.date)).length;
  const doneCount = weekSessions.filter((s) => s.done).length;
  const plannedMin = weekSessions.reduce((s, x) => s + (x.minutes || 0), 0);
  const bySport = {};
  weekSessions.forEach((s) => { bySport[s.sport] = (bySport[s.sport] || 0) + (s.minutes || 0); });
  const fmt = (d) => `${d.getDate()} ${MONTH_NAMES[d.getMonth()]}`;
  const isThisWeek = isoDays.includes(todayISO);
  const navBtn = { background: "#1A1D21", border: "1px solid #2A2E33", color: "#F2F1ED", borderRadius: 8, width: 36, height: 36, cursor: "pointer", fontSize: 16 };
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
        <button onClick={() => setWeekStart(addDays(weekStart, -7))} style={navBtn}>‹</button>
        <div style={{ textAlign: "center" }}>
          <div style={{ fontWeight: 600, fontSize: 15 }}>{fmt(days[0])} – {fmt(days[6])}</div>
          {!isThisWeek && <button onClick={() => setWeekStart(startOfWeek(new Date()))} style={{ background: "none", border: "none", color: "#FF4B2B", fontSize: 12, cursor: "pointer", marginTop: 2 }}>ir para esta semana</button>}
        </div>
        <button onClick={() => setWeekStart(addDays(weekStart, 7))} style={navBtn}>›</button>
      </div>

      <div style={{ background: "#1A1D21", border: "1px solid #2A2E33", borderRadius: 12, padding: "12px 16px", marginBottom: 14 }}>
        <div style={{ fontSize: 13 }}>
          {weekSessions.length === 0 ? "Sem treinos planeados nesta semana." : `${doneCount} de ${weekSessions.length} treinos concluídos · ${formatMinutes(plannedMin)} planeados`}
        </div>
        {Object.keys(bySport).length > 0 && (
          <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
            {Object.keys(bySport).map((k) => (
              <span key={k} className="chip" style={{ color: PLAN_SPORTS[k].color, borderColor: PLAN_SPORTS[k].color + "55" }}>{PLAN_SPORTS[k].label} {formatMinutes(bySport[k])}</span>
            ))}
          </div>
        )}
      </div>

      {weekSessions.length === 0 && prevCount > 0 && (
        <button onClick={onCopyPrev} style={{ width: "100%", background: "none", border: "1px dashed #2A2E33", color: "#8B9096", borderRadius: 12, padding: "12px 16px", cursor: "pointer", fontSize: 13, marginBottom: 14 }}>Copiar treinos da semana anterior</button>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {days.map((d, i) => {
          const iso = isoDays[i];
          const items = plan.filter((s) => s.date === iso);
          const isToday = iso === todayISO;
          return (
            <div key={iso} style={{ background: "#1A1D21", border: `1px solid ${isToday ? "#FF4B2B66" : "#2A2E33"}`, borderRadius: 12, padding: "12px 14px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: isToday ? "#FF4B2B" : "#F2F1ED" }}>{DAY_NAMES[i]} <span style={{ color: "#5A5F64", fontWeight: 500 }}>{d.getDate()} {MONTH_NAMES[d.getMonth()]}</span></div>
                <button onClick={() => onAdd(iso)} style={{ background: "none", border: "1px solid #2A2E33", color: "#8B9096", borderRadius: 8, width: 30, height: 30, cursor: "pointer", fontSize: 16 }}>+</button>
              </div>
              {items.length > 0 && (
                <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 10 }}>
                  {items.map((s) => {
                    const ps = PLAN_SPORTS[s.sport] || PLAN_SPORTS.run;
                    return (
                      <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 10, opacity: s.done ? 0.55 : 1 }}>
                        <button onClick={() => onToggle(s.id)} style={{ width: 22, height: 22, borderRadius: 6, border: `1px solid ${ps.color}`, background: s.done ? ps.color : "transparent", cursor: "pointer", flexShrink: 0, color: "#101214", fontSize: 13, fontWeight: 700, lineHeight: 1 }}>{s.done ? "✓" : ""}</button>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: 14, textDecoration: s.done ? "line-through" : "none" }}>{s.title}</div>
                          <div style={{ fontSize: 11, color: ps.color, marginTop: 1 }}>{ps.label}{s.minutes ? ` · ${formatMinutes(s.minutes)}` : ""}</div>
                        </div>
                        <button onClick={() => onDelete(s.id)} style={{ background: "none", border: "none", color: "#5A5F64", cursor: "pointer", fontSize: 14 }}>✕</button>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function SaveButton({ onClick, children }) {

function RaceForm({ initialSport, onSave, onClose }) {
  const [sport, setSport] = useState(initialSport && initialSport !== "all" ? initialSport : "run");
  const [name, setName] = useState("");
  const [date, setDate] = useState(localISO(new Date()));
  const [preset, setPreset] = useState(DEFAULT_PRESET[initialSport && initialSport !== "all" && initialSport !== "tri" ? initialSport : "run"]);
  const [customVal, setCustomVal] = useState("");
  const [timeStr, setTimeStr] = useState("");
  const [elevation, setElevation] = useState("");
  const [weatherCondition, setWeatherCondition] = useState("None");
  const [tempC, setTempC] = useState("");
  const [surface, setSurface] = useState(SPORTS[initialSport && initialSport !== "all" ? initialSport : "run"].surfaces[0] || "");
  const [excludeFromPR, setExcludeFromPR] = useState(false);
  const [format, setFormat] = useState("olympic");
  const [swimT, setSwimT] = useState("");
  const [t1T, setT1T] = useState("");
  const [bikeT, setBikeT] = useState("");
  const [t2T, setT2T] = useState("");
  const [runT, setRunT] = useState("");
  const [totalT, setTotalT] = useState("");
  const [error, setError] = useState("");

  function changeSport(s) {
    setSport(s); setError("");
    if (s !== "tri") { setPreset(DEFAULT_PRESET[s]); setSurface(SPORTS[s].surfaces[0]); setCustomVal(""); }
  }

  function submit() {
    if (!name.trim()) return setError("Dá um nome à prova.");
    const weather = weatherCondition !== "None" ? { condition: weatherCondition, tempC: num(tempC) } : null;
    if (sport === "tri") {
      const swim = parseTime(swimT), bike = parseTime(bikeT), run = parseTime(runT);
      if (!swim || !bike || !run) return setError("Preenche pelo menos natação, bicicleta e corrida (mm:ss ou hh:mm:ss).");
      const t1 = t1T.trim() ? parseTime(t1T) : null;
      const t2 = t2T.trim() ? parseTime(t2T) : null;
      if ((t1T.trim() && !t1) || (t2T.trim() && !t2)) return setError("T1/T2 inválidos — usa mm:ss.");
      const sum = swim + (t1 || 0) + bike + (t2 || 0) + run;
      const total = totalT.trim() ? parseTime(totalT) : null;
      if (totalT.trim() && !total) return setError("Tempo total inválido.");
      if (total && total < sum - 1) return setError(`O tempo total (${formatTime(total)}) é menor que a soma dos parciais (${formatTime(sum)}).`);
      onSave({ id: uid(), sport: "tri", name: name.trim(), date, km: triTotalKm(format), seconds: total || sum, tri: { format, swim, t1, bike, t2, run }, weather, excludeFromPR });
      return;
    }
    const secs = parseTime(timeStr);
    let km;
    if (preset === "custom") { const v = num(customVal); km = v ? (sport === "swim" ? v / 1000 : v) : null; }
    else km = SPORTS[sport].distances.find((s) => s.key === preset).km;
    if (!km || km <= 0) return setError("Distância inválida.");
    if (!secs) return setError("Tempo no formato mm:ss ou hh:mm:ss.");
    onSave({ id: uid(), sport, name: name.trim(), date, km, seconds: secs, elevationM: sport === "swim" ? null : num(elevation), weather, surface, excludeFromPR });
  }

  const sp = SPORTS[sport];
  return (
    <Modal title="Registar prova" onClose={onClose}>
      <SportChips value={sport} onChange={changeSport} keys={["run", "swim", "bike", "tri"]} mb={14} />
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <label><div style={labelStyle()}>Nome</div><input style={fieldStyle()} value={name} onChange={(e) => setName(e.target.value)} placeholder={sport === "tri" ? "ex: Triatlo de Cascais" : "ex: Meia de Lisboa"} /></label>
        <label><div style={labelStyle()}>Data</div><input type="date" style={fieldStyle()} value={date} onChange={(e) => setDate(e.target.value)} /></label>

        {sport === "tri" ? (
          <>
            <label><div style={labelStyle()}>Formato</div>
              <select style={fieldStyle()} value={format} onChange={(e) => setFormat(e.target.value)}>
                {TRI_FORMATS.map((f) => <option key={f.key} value={f.key}>{f.label}{f.key !== "other" ? ` (${Math.round(f.swimKm * 1000)}m / ${f.bikeKm}km / ${+f.runKm.toFixed(1)}km)` : ""}</option>)}
              </select>
            </label>
            <div style={{ display: "flex", gap: 10 }}>
              <label style={{ flex: 1 }}><div style={labelStyle()}>🏊 Natação</div><input style={fieldStyle()} value={swimT} onChange={(e) => setSwimT(e.target.value)} placeholder="mm:ss" /></label>
              <label style={{ flex: 1 }}><div style={labelStyle()}>T1 (opcional)</div><input style={fieldStyle()} value={t1T} onChange={(e) => setT1T(e.target.value)} placeholder="mm:ss" /></label>
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <label style={{ flex: 1 }}><div style={labelStyle()}>🚴 Bicicleta</div><input style={fieldStyle()} value={bikeT} onChange={(e) => setBikeT(e.target.value)} placeholder="h:mm:ss" /></label>
              <label style={{ flex: 1 }}><div style={labelStyle()}>T2 (opcional)</div><input style={fieldStyle()} value={t2T} onChange={(e) => setT2T(e.target.value)} placeholder="mm:ss" /></label>
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <label style={{ flex: 1 }}><div style={labelStyle()}>🏃 Corrida</div><input style={fieldStyle()} value={runT} onChange={(e) => setRunT(e.target.value)} placeholder="mm:ss" /></label>
              <label style={{ flex: 1 }}><div style={labelStyle()}>Total (opcional)</div><input style={fieldStyle()} value={totalT} onChange={(e) => setTotalT(e.target.value)} placeholder="h:mm:ss" /></label>
            </div>
            <div style={{ fontSize: 12, color: "#5A5F64", marginTop: -6 }}>Sem total, soma os parciais. Com total oficial, a diferença aparece como "outros".</div>
          </>
        ) : (
          <>
            <label><div style={labelStyle()}>Distância</div>
              <select style={fieldStyle()} value={preset} onChange={(e) => setPreset(e.target.value)}>
                {sp.distances.map((s) => <option key={s.key} value={s.key}>{s.label}{sport !== "swim" ? ` (${+s.km.toFixed(2)} km)` : ""}</option>)}
                <option value="custom">Personalizada</option>
              </select>
            </label>
            {preset === "custom" && <label><div style={labelStyle()}>{sport === "swim" ? "Distância em metros" : "Distância em km"}</div><input style={fieldStyle()} inputMode="decimal" value={customVal} onChange={(e) => setCustomVal(e.target.value)} placeholder={sport === "swim" ? "ex: 2500" : "ex: 13"} /></label>}
            <label><div style={labelStyle()}>Tempo</div><input style={fieldStyle()} value={timeStr} onChange={(e) => setTimeStr(e.target.value)} placeholder="mm:ss ou hh:mm:ss" /></label>
            {sport !== "swim" && <label><div style={labelStyle()}>Elevação (m)</div><input style={fieldStyle()} inputMode="decimal" value={elevation} onChange={(e) => setElevation(e.target.value)} placeholder="opcional" /></label>}
            <label><div style={labelStyle()}>{sport === "swim" ? "Local" : "Superfície"}</div>
              <select style={fieldStyle()} value={surface} onChange={(e) => setSurface(e.target.value)}>
                {sp.surfaces.map((s) => <option key={s} value={s}>{SURFACE_LABELS[s] || s}</option>)}
              </select>
            </label>
          </>
        )}

        <div style={{ display: "flex", gap: 10 }}>
          <label style={{ flex: 1 }}><div style={labelStyle()}>Clima</div><select style={fieldStyle()} value={weatherCondition} onChange={(e) => setWeatherCondition(e.target.value)}>{WEATHER_OPTIONS.map((w) => <option key={w} value={w}>{w}</option>)}</select></label>
          <label style={{ flex: 1 }}><div style={labelStyle()}>Temp (°C)</div><input style={fieldStyle()} inputMode="decimal" value={tempC} onChange={(e) => setTempC(e.target.value)} placeholder="opcional" /></label>
        </div>
        <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
          <input type="checkbox" checked={excludeFromPR} onChange={(e) => setExcludeFromPR(e.target.checked)} />
          <span style={{ fontSize: 13, color: "#8B9096" }}>Não contar esta prova para PRs</span>
        </label>
        {error && <div style={{ color: "#FF4B2B", fontSize: 13 }}>{error}</div>}
        <SaveButton onClick={submit}>Guardar</SaveButton>
      </div>
    </Modal>
  );
}

function GoalForm({ onSave, onClose }) {
  const [sport, setSport] = useState("run");
  const [name, setName] = useState("");
  const [date, setDate] = useState("");
  const [preset, setPreset] = useState("5k");
  const [customVal, setCustomVal] = useState("");
  const [format, setFormat] = useState("olympic");
  const [timeStr, setTimeStr] = useState("");
  const [error, setError] = useState("");
  function changeSport(s) { setSport(s); setError(""); if (s !== "tri") { setPreset(DEFAULT_PRESET[s]); setCustomVal(""); } }
  function submit() {
    const secs = parseTime(timeStr);
    if (!name.trim()) return setError("Dá um nome ao objetivo.");
    if (!date) return setError("Escolhe uma data.");
    if (sport === "tri") {
      if (!secs) return setError("Tempo no formato mm:ss ou hh:mm:ss.");
      onSave({ id: uid(), sport, name: name.trim(), date, triFormat: format, km: triTotalKm(format), seconds: secs });
      return;
    }
    let km;
    if (preset === "custom") { const v = num(customVal); km = v ? (sport === "swim" ? v / 1000 : v) : null; }
    else km = SPORTS[sport].distances.find((s) => s.key === preset).km;
    if (!km || km <= 0) return setError("Distância inválida.");
    if (!secs) return setError("Tempo no formato mm:ss ou hh:mm:ss.");
    onSave({ id: uid(), sport, name: name.trim(), date, distanceKey: preset === "custom" ? null : preset, km, seconds: secs });
  }
  const sp = SPORTS[sport];
  return (
    <Modal title="Definir objetivo" onClose={onClose}>
      <SportChips value={sport} onChange={changeSport} keys={["run", "swim", "bike", "tri"]} mb={14} />
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <label><div style={labelStyle()}>Nome</div><input style={fieldStyle()} value={name} onChange={(e) => setName(e.target.value)} placeholder="ex: Sub-1:45 meia" /></label>
        <label><div style={labelStyle()}>Data da prova</div><input type="date" style={fieldStyle()} value={date} onChange={(e) => setDate(e.target.value)} /></label>
        {sport === "tri" ? (
          <label><div style={labelStyle()}>Formato</div>
            <select style={fieldStyle()} value={format} onChange={(e) => setFormat(e.target.value)}>
              {TRI_FORMATS.filter((f) => f.key !== "other").map((f) => <option key={f.key} value={f.key}>{f.label}</option>)}
            </select>
          </label>
        ) : (
          <>
            <label><div style={labelStyle()}>Distância</div>
              <select style={fieldStyle()} value={preset} onChange={(e) => setPreset(e.target.value)}>
                {sp.distances.map((s) => <option key={s.key} value={s.key}>{s.label}{sport !== "swim" ? ` (${+s.km.toFixed(2)} km)` : ""}</option>)}
                <option value="custom">Personalizada</option>
              </select>
            </label>
            {preset === "custom" && <label><div style={labelStyle()}>{sport === "swim" ? "Distância em metros" : "Distância em km"}</div><input style={fieldStyle()} inputMode="decimal" value={customVal} onChange={(e) => setCustomVal(e.target.value)} placeholder={sport === "swim" ? "ex: 2500" : "ex: 13"} /></label>}
          </>
        )}
        <label><div style={labelStyle()}>{sport === "tri" ? "Tempo total alvo" : "Tempo alvo"}</div><input style={fieldStyle()} value={timeStr} onChange={(e) => setTimeStr(e.target.value)} placeholder="mm:ss ou hh:mm:ss" /></label>
        {error && <div style={{ color: "#FF4B2B", fontSize: 13 }}>{error}</div>}
        <SaveButton onClick={submit}>Guardar</SaveButton>
      </div>
    </Modal>
  );
}

function ManualPRModal({ sport, manualPRs, races, onSave, onClose }) {
  const dists = SPORTS[sport].distances;
  const [distanceKey, setDistanceKey] = useState(dists[0].key);
  const [timeStr, setTimeStr] = useState("");
  const [note, setNote] = useState("");
  const [date, setDate] = useState("");
  const [linkedRaceId, setLinkedRaceId] = useState("");
  const [error, setError] = useState("");
  const fullKey = sport + ":" + distanceKey;
  const existing = manualPRs[fullKey];
  const sportRaces = races.filter((r) => (r.sport || "run") === sport);
  function handleLinkRace(id) {
    setLinkedRaceId(id);
    const r = races.find((x) => x.id === id);
    if (r) { setNote(r.name); setDate(r.date); }
  }
  function submit() {
    const secs = parseTime(timeStr);
    if (!secs) return setError("Tempo no formato mm:ss ou hh:mm:ss.");
    onSave(fullKey, { seconds: secs, note: note.trim() || null, date: date || null });
    onClose();
  }
  function clear() { onSave(fullKey, null); onClose(); }
  return (
    <Modal title={`PR manual · ${SPORTS[sport].label}`} onClose={onClose}>
      <div style={{ fontSize: 13, color: "#8B9096", marginBottom: 14, lineHeight: 1.5 }}>
        Para distâncias que raramente competes oficialmente — como um parcial dentro de uma prova mais longa. É substituído automaticamente quando registares uma prova exatamente nessa distância que seja mais rápida.
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <label><div style={labelStyle()}>Distância</div><select style={fieldStyle()} value={distanceKey} onChange={(e) => setDistanceKey(e.target.value)}>{dists.map((s) => <option key={s.key} value={s.key}>{s.label}</option>)}</select></label>
        {sportRaces.length > 0 && (
          <label>
            <div style={labelStyle()}>Veio de uma prova registada? (opcional)</div>
            <select style={fieldStyle()} value={linkedRaceId} onChange={(e) => handleLinkRace(e.target.value)}>
              <option value="">— nenhuma, escrever à mão —</option>
              {sportRaces.map((r) => <option key={r.id} value={r.id}>{r.name} ({r.date})</option>)}
            </select>
          </label>
        )}
        <label><div style={labelStyle()}>Tempo a esta distância</div><input style={fieldStyle()} value={timeStr} onChange={(e) => setTimeStr(e.target.value)} placeholder="mm:ss ou hh:mm:ss" /></label>
        <label><div style={labelStyle()}>Prova / nota</div><input style={fieldStyle()} value={note} onChange={(e) => setNote(e.target.value)} placeholder="ex: parcial da Meia do Porto" /></label>
        <label><div style={labelStyle()}>Data (opcional)</div><input type="date" style={fieldStyle()} value={date} onChange={(e) => setDate(e.target.value)} /></label>
        {error && <div style={{ color: "#FF4B2B", fontSize: 13 }}>{error}</div>}
        <SaveButton onClick={submit}>Guardar</SaveButton>
        {existing && <button onClick={clear} style={{ background: "none", border: "none", color: "#5A5F64", fontSize: 13, cursor: "pointer", textDecoration: "underline" }}>Remover PR manual desta distância</button>}
      </div>
    </Modal>
  );
}

function SessionForm({ date, onSave, onClose }) {
  const [sport, setSport] = useState("run");
  const [title, setTitle] = useState("");
  const [minutes, setMinutes] = useState("");
  const [d, setD] = useState(date);
  const [error, setError] = useState("");
  function submit() {
    const m = minutes.trim() ? num(minutes) : null;
    if (minutes.trim() && (!m || m <= 0)) return setError("Duração inválida (em minutos).");
    if (!d) return setError("Escolhe um dia.");
    onSave({ id: uid(), date: d, sport, title: title.trim() || PLAN_SPORTS[sport].label, minutes: m, done: false });
  }
  return (
    <Modal title="Agendar treino" onClose={onClose}>
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <div className="scrollx" style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 4 }}>
          {Object.keys(PLAN_SPORTS).map((k) => {
            const active = sport === k;
            const c = PLAN_SPORTS[k].color;
            return <button key={k} onClick={() => setSport(k)} style={{ flexShrink: 0, padding: "7px 12px", borderRadius: 20, cursor: "pointer", fontSize: 12, fontWeight: 600, border: `1px solid ${active ? c : "#2A2E33"}`, background: active ? c + "22" : "transparent", color: active ? c : "#8B9096" }}>{PLAN_SPORTS[k].label}</button>;
          })}
        </div>
        <label><div style={labelStyle()}>Treino</div><input style={fieldStyle()} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="ex: 10x100 ritmo de prova" /></label>
        <label><div style={labelStyle()}>Duração (minutos, opcional)</div><input style={fieldStyle()} inputMode="numeric" value={minutes} onChange={(e) => setMinutes(e.target.value)} placeholder="ex: 60" /></label>
        <label><div style={labelStyle()}>Dia</div><input type="date" style={fieldStyle()} value={d} onChange={(e) => setD(e.target.value)} /></label>
        {error && <div style={{ color: "#FF4B2B", fontSize: 13 }}>{error}</div>}
        <SaveButton onClick={submit}>Agendar</SaveButton>
      </div>
    </Modal>
  );
}

function ImportModal({ onSave, onClose }) {
  const [rows, setRows] = useState([]);
  const [error, setError] = useState("");
  const [fileName, setFileName] = useState("");
  const inputRef = useRef(null);
  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setFileName(file.name); setError("");
    const reader = new FileReader();
    reader.onload = (ev) => {
      const text = ev.target.result;
      try {
        let parsed = [];
        if (file.name.toLowerCase().endsWith(".gpx")) {
          parsed = parseGpxText(text, file.name);
          if (parsed.length === 0) setError("Não encontrei pontos de percurso neste GPX.");
        } else {
          parsed = parseCsvText(text);
          if (parsed.length === 0) setError("Não encontrei colunas de distância/tempo neste CSV.");
        }
        setRows(parsed);
      } catch (err) { setError("Não consegui ler este ficheiro."); }
    };
    reader.readAsText(file);
  }
  function updateRow(id, patch) { setRows((prev) => prev.map((r) => (r.id === id ? { ...r, ...patch } : r))); }
  function confirm() {
    const toAdd = rows.filter((r) => r.include).map((r) => ({
      id: r.id, sport: r.sport, name: r.name || "Imported", date: r.date,
      km: num(r.km), seconds: typeof r.seconds === "number" ? r.seconds : parseTime(r.seconds),
      elevationM: r.sport === "swim" ? null : r.elevationM || null, weather: null,
      surface: SPORTS[r.sport].surfaces[0], excludeFromPR: false,
    })).filter((r) => r.km > 0 && r.seconds > 0);
    if (toAdd.length === 0) return setError("Nenhuma linha válida selecionada.");
    onSave(toAdd);
  }
  return (
    <Modal title="Importar do Strava" onClose={onClose}>
      <div style={{ fontSize: 13, color: "#8B9096", marginBottom: 14, lineHeight: 1.5 }}>Exporta as atividades do Strava (CSV) ou uma atividade individual (GPX) e carrega aqui. Confirma a modalidade e a distância de cada linha — em natação, a distância é lida em km (1.5 = 1500 m).</div>
      <input ref={inputRef} type="file" accept=".csv,.gpx" onChange={handleFile} style={{ display: "none" }} />
      <button onClick={() => inputRef.current.click()} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, width: "100%", background: "none", border: "1px dashed #2A2E33", color: "#8B9096", borderRadius: 10, padding: 16, cursor: "pointer", fontSize: 14 }}>↑ {fileName || "Escolher ficheiro .csv ou .gpx"}</button>
      {error && <div style={{ color: "#FF4B2B", fontSize: 13, marginTop: 10 }}>{error}</div>}
      {rows.length > 0 && (
        <div style={{ marginTop: 18, display: "flex", flexDirection: "column", gap: 8 }}>
          <div style={{ fontSize: 12, color: "#5A5F64" }}>{rows.filter((r) => r.include).length} de {rows.length} selecionadas</div>
          {rows.map((r) => (
            <div key={r.id} style={{ background: "#1A1D21", border: "1px solid #2A2E33", borderRadius: 10, padding: 12, opacity: r.include ? 1 : 0.5 }}>
              <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 8 }}>
                <button onClick={() => updateRow(r.id, { include: !r.include })} style={{ width: 20, height: 20, borderRadius: 5, border: "1px solid #2A2E33", background: r.include ? "#38D97F" : "transparent", cursor: "pointer", flexShrink: 0 }}></button>
                <input style={{ ...fieldStyle(), marginTop: 0, flex: 1 }} value={r.name} onChange={(e) => updateRow(r.id, { name: e.target.value })} />
              </div>
              <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                <select style={{ ...fieldStyle(), marginTop: 0 }} value={r.sport} onChange={(e) => updateRow(r.id, { sport: e.target.value })}>
                  {["run", "swim", "bike"].map((k) => <option key={k} value={k}>{SPORTS[k].label}</option>)}
                </select>
                <input type="date" style={{ ...fieldStyle(), marginTop: 0 }} value={r.date} onChange={(e) => updateRow(r.id, { date: e.target.value })} />
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <input style={{ ...fieldStyle(), marginTop: 0 }} inputMode="decimal" value={r.km ?? ""} onChange={(e) => updateRow(r.id, { km: e.target.value })} placeholder="km" />
                <input style={{ ...fieldStyle(), marginTop: 0 }} value={typeof r.seconds === "number" ? formatTime(r.seconds) : r.seconds ?? ""} onChange={(e) => updateRow(r.id, { seconds: e.target.value })} placeholder="mm:ss" />
              </div>
            </div>
          ))}
          <button onClick={confirm} style={{ background: "#FF4B2B", border: "none", color: "#101214", fontWeight: 700, borderRadius: 8, padding: "12px 0", fontSize: 14, cursor: "pointer", marginTop: 6 }}>Importar selecionadas</button>
        </div>
      )}
    </Modal>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
